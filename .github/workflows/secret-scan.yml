name: Secret scan

# gitleaks over the whole history on every run, not just the pushed commits: a run that is cancelled or skipped then
# leaves nothing unscanned, because the next run covers it. The history is small (a full scan takes about a second).
# No concurrency group: runs are never cancelled by a newer push.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks, full history)
    # Not in the private history repository, where minutes cost money; npm run check scans tracked files before commits.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, so the scan sees the whole history
          persist-credentials: false
      # The gitleaks CLI rather than gitleaks-action: the action scans only the pushed range on push and pull_request,
      # and downloads its binary without checking it. The tarball is checked against the SHA-256 in the project's
      # gitleaks_<version>_checksums.txt. To bump, replace version and hash together.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # --redact keeps any finding's value out of this public log; the file, line and commit are still shown.
      - name: scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
