# Weekly version updates, with minor and patch bumps grouped into one pull request per ecosystem. Each waits 3 days
# after a release (a week for a major npm version), so a bad or hijacked version is usually pulled before it is proposed;
# security updates don't wait. Minor and patch updates of npm packages and Actions merge themselves once CI passes
# (dependabot-auto-merge.yml); the rest wait for a person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The type definitions follow the Node version gork runs on (24, as .nvmrc and package.json's engines say).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Published without its platform binaries (they start again at 2.6.2), so npm can't install it.
      - dependency-name: "@biomejs/biome"
        versions: ["2.6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions and Docker take only default-days: Dependabot has no separate major-version cooldown for them.
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # The base image stays on Node 24, the version .nvmrc and package.json's engines name.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
